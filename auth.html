
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RÉMORA | Customer Account</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <main class="auth-page">
        <a href="index.html" class="brand">RÉMORA<span>.</span></a>

        <section class="auth-card">
            <p class="eyebrow">WELCOME TO RÉMORA</p>
            <h1 id="formTitle">Welcome Back</h1>
            <p class="subtitle" id="formSubtitle">
                Sign in to your account
            </p>

            <form id="loginForm">
                <label for="loginIdentifier">Email Address</label>
                <input
                    type="text"
                    id="loginIdentifier"
                    placeholder="Enter your email address"
                    autocomplete="username"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">Sign In</button>
            </form>

            <form id="signupForm" class="auth-hidden">
                <label for="signupUsername">Username</label>
                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Choose a username"
                    autocomplete="username"
                    minlength="3"
                    required
                >

                <label for="signupEmail">Email Address</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="signupButton">Create Account</button>
            </form>

            <p id="authMessage" role="status"></p>

            <div class="switch-auth">
                <span id="switchText">Don't have an account?</span>
                <button type="button" id="switchButton">Sign Up</button>
            </div>

            <a href="index.html" class="back-link">← Back to Shop</a>
        </section>
    </main>

    <script type="module" src="auth.js"></script>
</body>
</html>
